# APK-építés: minden main-ágra érkező kódváltozásnál (a naptárfájl és a leírás változása nem indít építést),
# illetve kézzel (Actions → APK → Run workflow). Az eredmény egy GitHub Release a Tulora.apk fájllal;
# a mindig legfrissebb változat letöltési címe: /releases/latest/download/Tulora.apk
name: APK

on:
  push:
    branches: [main]
    paths-ignore: ["calendar.json", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aláírókulcs ellenőrzése
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Hiányzik az ANDROID_KEYSTORE_B64 vagy az ANDROID_KEYSTORE_PASSWORD titok (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Függőségek
        run: npm install --no-audit --no-fund

      - name: Weboldal (www/) összeállítása
        run: npm run build:www

      - name: Android-projekt és ikonok
        run: |
          npx cap add android
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#c2410c' --iconBackgroundColorDark '#c2410c' \
            --splashBackgroundColor '#faf8f5' --splashBackgroundColorDark '#181614'
          npx cap sync android

      - name: Verziószám
        id: ver
        run: |
          NAME=$(node -p "require('./package.json').version")
          CODE=${{ github.run_number }}
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME-$CODE" >> "$GITHUB_OUTPUT"

      - name: Fordítás (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Aláírás
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tulora.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/tulora.jks" --ks-key-alias tulora \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out Tulora.apk aligned.apk
          "$BT/apksigner" verify --print-certs Tulora.apk | head -3
          rm -f "$RUNNER_TEMP/tulora.jks"

      - name: Kiadás (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" Tulora.apk \
            --title "Túlóranapló ${{ steps.ver.outputs.name }} (${{ github.run_number }})" \
            --notes "Telepítés: töltsd le a Tulora.apk fájlt a telefonon, és nyisd meg. Frissítésnél a régi fölé települ, az adatok megmaradnak." \
            --latest
